<!DOCTYPE html>
<html>
<head><title>Media browser</title></head>
<!--
  What Drupal 7's Media module actually loads into its modal.

  The real flow, which the previous fixture skipped entirely by calling a
  simulateMediaSelect() helper straight from the test:

    1. The widget's "Browse" launcher calls Drupal.media.popups.mediaBrowser(onSelect),
       which builds a dialog containing an IFRAME pointed at /media/browser.
    2. The library lives in that iframe, on the same origin as the form.
    3. Choosing a file calls back into the opener — parent.Drupal.media.browser.select in
       the real module — with the fid.
    4. The opener writes the fid and triggers the field's AJAX submit, and Drupal answers
       with commands that replaceWith() the widget's -ajax-wrapper.

  Steps 1-3 were never exercised, so nothing proved the launcher still worked after the
  overlay relocated it into a shadow host's light DOM, or that the dialog was not painted
  underneath the overlay.
-->
<body class="media-browser-page">
<div class="media-library">
  <h1>Media library</h1>
  <ul class="media-list">
    <li>
      <button type="button" class="media-item" data-fid="9911" data-filename="campus-quad.jpg">
        campus-quad.jpg
      </button>
    </li>
    <li>
      <button type="button" class="media-item" data-fid="9912" data-filename="lab-bench.jpg">
        lab-bench.jpg
      </button>
    </li>
    <li>
      <button type="button" class="media-item" data-fid="9913" data-filename="atrium.png">
        atrium.png
      </button>
    </li>
  </ul>
</div>

<script>
/*
  Calls back into the opener, as the real media browser does. Same origin, so the parent's
  function is directly reachable — which is also why the browser must be served from a real
  URL rather than a blob or data: document.
*/
document.addEventListener('click', function (event) {
  var button = event.target.closest ? event.target.closest('.media-item') : null;
  if (!button) return;

  var api = window.parent && window.parent.Drupal
    && window.parent.Drupal.media && window.parent.Drupal.media.browser;
  if (!api || typeof api.select !== 'function') {
    document.body.setAttribute('data-callback-missing', '1');
    return;
  }
  api.select({
    fid: button.getAttribute('data-fid'),
    filename: button.getAttribute('data-filename'),
  });
});
</script>
</body>
</html>
