<html><head><title>Add menu link | Main menu</title></head>
<body class="admin-menu">
<!--
  Drupal's menu-link add form, reduced to the one thing that matters: the Parent link
  select. Drupal builds it from the FULL menu tree even when BigMenu is paginating the
  overview table, so this single page is the whole index — which is what makes searching a
  3,000-item menu possible without expanding anything.

  The select is named `parent` here, not `menu[parent]` as on a node form. That is why the
  parser matches on the option VALUE shape rather than on a select name.
-->

    <label for="edit-link-title">Menu link title</label>

  </div>
