<!DOCTYPE html>
<!--
  An EXISTING article's edit form, with images already attached.

  This is the shape that made the Multimedia section disappear. A populated Media widget
  has NO visible control: the file is represented by a hidden fid, and the only
  interactive controls are Remove/Edit submit buttons. The walker excludes hidden and
  submit inputs as structural, so nothing survived and the field ceased to exist — which
  removed the only route to changing the image.

  Modelled on columbiadoctors.org/node/18948/edit.
-->
<html>
<head><title>Edit News</title></head>
<body class="logged-in">
<div id="toolbar"><a href="/user/1">ab1234</a></div>
<form action="/node/18948/edit" method="post" id="news-node-form" accept-charset="UTF-8">
  <input type="hidden" name="form_build_id" value="form-abc123" />
  <input type="hidden" name="form_token" value="tok123" />
  <input type="hidden" name="form_id" value="news_node_form" />
  <input type="hidden" name="changed" value="1756200000" />

  <fieldset class="field-group-tab">
    <legend><span class="fieldset-legend">Overview</span></legend>
    <div class="form-item form-type-textfield">
      <label for="edit-title">Title <span class="form-required">*</span></label>
      <input type="text" id="edit-title" name="title_field[und][0][value]" class="form-text required" required="required" value="Why Are Girls Starting Puberty Earlier?" />
    </div>
  </fieldset>

  <fieldset class="field-group-tab">
    <legend><span class="fieldset-legend">Multimedia</span></legend>

    <div class="field-widget-media-generic" id="edit-field-image-teaser-und-0-ajax-wrapper">
      <label>Teaser Image</label>
      <div class="media-thumbnail preview-teaser">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAAAAAAALAAAAAABAAEAAAIBRAA7" width="60" height="40" alt="" />
        <span class="filename">puberty-study-teaser.jpg</span>
      </div>
      <input type="hidden" name="field_image_teaser[und][0][fid]" value="44120" />
      <input type="submit" name="field_image_teaser_und_0_remove_button" value="Remove" class="form-submit" />
      <input type="submit" name="field_image_teaser_und_0_edit_button" value="Edit" class="form-submit" />
    </div>

    <div class="field-widget-media-generic" id="edit-field-image-hero-und-0-ajax-wrapper">
      <label>Hero Image</label>
      <div class="media-thumbnail preview-hero">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAAAAAAALAAAAAABAAEAAAIBRAA7" width="60" height="40" alt="" />
        <span class="filename">puberty-study-hero.jpg</span>
      </div>
      <input type="hidden" name="field_image_hero[und][0][fid]" value="44121" />
      <input type="submit" name="field_image_hero_und_0_remove_button" value="Remove" class="form-submit" />
    </div>
  </fieldset>

  <input type="submit" id="edit-submit" name="op" value="Save" />
</form>
<script>
/*
  Stands in for Drupal's Remove: an AJAX submit whose response replaces the widget's
  ajax-wrapper with the EMPTY widget. The empty markup is copied from the real capture
  (captured/news.html), and its shape is the point: the field is now keyed by the
  launcher's media[field_x_und_0] input rather than the populated widget's hidden
  field_x[und][0][fid], so the same field comes back under a different name.
*/
document.addEventListener('click', function (event) {
  var button = event.target.closest ? event.target.closest('input[name$="_remove_button"]') : null;
  if (!button) return;
  event.preventDefault();
  var field = button.name.match(/^field_image_(\w+)_und_0_remove_button$/)[1];
  var wrapperId = 'edit-field-image-' + field + '-und-0-ajax-wrapper';
  var label = field === 'hero' ? 'Hero Image' : 'Teaser Image';
  window.setTimeout(function () {
    var old = document.getElementById(wrapperId);
    var fresh = document.createElement('div');
    fresh.className = 'field-widget-media-generic';
    fresh.id = wrapperId;
    fresh.innerHTML = ''
      + '<div class="form-item form-type-media form-item-field-image-' + field + '-und-0">'
      +   '<label for="edit-field-image-' + field + '-und-0-upload">' + label + ' </label>'
      +   '<div class="media-widget form-media clearfix">'
      +     '<div class="preview"></div>'
      +     '<input class="upload form-text" type="text" id="edit-field-image-' + field + '-und-0-upload"'
      +       ' name="media[field_image_' + field + '_und_0]" value="" size="22" maxlength="128" style="display: none;">'
      +     '<a href="#" class="button browse launcher" data-field="' + field + '">Browse</a>'
      +     '<input class="fid" type="hidden" name="field_image_' + field + '[und][0][fid]" value="">'
      +   '</div>'
      + '</div>';
    old.parentNode.replaceChild(fresh, old);
  }, 150);
});

/*
  Stands in for picking a file in the media browser: the response renders the POPULATED
  widget again, keyed by its hidden fid — the rename back the other way.
*/
document.addEventListener('click', function (event) {
  var launcher = event.target.closest ? event.target.closest('a.launcher') : null;
  if (!launcher) return;
  event.preventDefault();
  var field = launcher.getAttribute('data-field');
  var wrapperId = 'edit-field-image-' + field + '-und-0-ajax-wrapper';
  var label = field === 'hero' ? 'Hero Image' : 'Teaser Image';
  window.setTimeout(function () {
    var old = document.getElementById(wrapperId);
    var fresh = document.createElement('div');
    fresh.className = 'field-widget-media-generic';
    fresh.id = wrapperId;
    fresh.innerHTML = ''
      + '<label>' + label + '</label>'
      + '<div class="media-thumbnail preview-' + field + '"><span class="filename">new-' + field + '.jpg</span></div>'
      + '<input type="hidden" name="field_image_' + field + '[und][0][fid]" value="50001" />'
      + '<input type="submit" name="field_image_' + field + '_und_0_remove_button" value="Remove" class="form-submit" />';
    old.parentNode.replaceChild(fresh, old);
  }, 150);
});
</script>
</body>
</html>
